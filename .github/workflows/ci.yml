name: CI - Tests API RAG

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    env:
      SECRET_KEY: clave-secreta-exclusiva-para-tests
      OPENAI_API_KEY: test-api-key

      USER_DB_DIR: ./database/test
      CHROMA_DB_DIR: ./database/test_chroma


    steps:

      # 1. Descargar código
      - name: Descargar código
        uses: actions/checkout@v5


      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # 3. Actualizar pip
      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip


      # 4. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt


      # 5. Ejecutar todos los tests
      - name: Ejecutar tests
        run: |
          python -m pytest -v